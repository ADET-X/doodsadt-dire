<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Meta viewport diperbarui untuk mencegah zoom dan mengunci skala -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Watch Video</title>

  <!-- === METADATA TWITTER (TANPA GAMBAR) === -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Play Video">
  <meta name="twitter:description" content="Tonton selengkapnya di sini.">

  <style>
    /* Kunci total html dan body agar tidak bisa di-scroll */
    html, body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      
      /* Properti Anti-Scroll */
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      touch-action: none;
      overscroll-behavior: none;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* Animasi Loading (Spinner) */
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #ee4d2d; /* Warna oranye identik Shopee */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin: 0;
    }
    p {
      color: #666;
      font-size: 0.9rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    /* CSS Tombol Lanjutkan */
    .btn-lanjut {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 500;
      color: #fff;
      background-color: #ee4d2d;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none; /* Disembunyikan dulu, dimunculkan lewat JS jika link valid */
      transition: background-color 0.2s ease;
    }
    .btn-lanjut:hover {
      background-color: #d73a1e;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="status">Sedang memuat...</h1>
    <p id="substatus">Anda akan dialihkan secara otomatis dalam 10 detik.</p>
    
    <!-- Tombol Lanjutkan -->
    <button id="btn-lanjutkan" class="btn-lanjut">Lanjutkan</button>
  </div>

  <script>
    // Mencegah interaksi scroll dengan sentuhan di layar HP
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    const path = window.location.pathname;
    let targetUrl = "";

    // Cegah redirect jika URL hanya domain utama (root "/")
    if (path === "/" || path === "") {
      targetUrl = "";
    }
    
    // /t/xxx → Tokopedia
    else if (path.startsWith("/t/")) {
      const code = path.replace("/t/", "");
      targetUrl = "https://vt.tokopedia.com/t/" + code;
    }

    // /f/xxx → Player
    else if (path.startsWith("/f/")) {
      targetUrl = "https://vt.tokopedia.com/t/ZS9ARRSo47sm7-ufTN5/";
    }

    // /e/xxx → Doodsadt
    else if (path.startsWith("/e/")) {
      const code = path.replace("/e/", "");
      targetUrl = "https://doodsadt.online/?id=" + code;
    }

    // /a/ → Ads
    else if (path.startsWith("/a/")) {
      targetUrl = "https://s.shopee.co.id/1130VJTjXx";
    }

    // 🔥 domainku/xxx → Shopee
    else {
      let code = path.substring(1); 
      code = code.replace(/\.mp4$/i, ""); 
      targetUrl = "https://s.shopee.co.id/" + code;
    }

    // ==========================================
    // EKSEKUSI REDIRECT (TOMBOL & AUTO 10 DETIK)
    // ==========================================
    const btnLanjutkan = document.getElementById('btn-lanjutkan');
    const substatusText = document.getElementById('substatus');

    if (targetUrl !== "") {
      let timeLeft = 5; // Waktu tunggu 10 detik

      // 1. Tampilkan tombol
      btnLanjutkan.style.display = "block";

      // 2. Buat hitung mundur text agar user tahu sisa waktunya
      const timerInterval = setInterval(function() {
        timeLeft--;
        substatusText.innerHTML = "Anda akan dialihkan secara otomatis dalam " + timeLeft + " detik.";
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
        }
      }, 1000);

      // 3. Set timer 10 detik (10.000 ms) untuk redirect otomatis
      const redirectTimeout = setTimeout(function() {
        window.location.replace(targetUrl);
      }, 5000);

      // 4. Jika tombol Lanjutkan diklik, hentikan timer & langsung alihkan
      btnLanjutkan.addEventListener('click', function() {
        clearTimeout(redirectTimeout);
        clearInterval(timerInterval);
        
        // Ubah teks & tombol saat proses mengalihkan
        substatusText.innerHTML = "Mengalihkan sekarang...";
        btnLanjutkan.innerHTML = "Tunggu...";
        btnLanjutkan.style.opacity = "0.7";
        btnLanjutkan.style.cursor = "not-allowed";

        window.location.replace(targetUrl);
      });

    } else {
      // Fallback 404
      document.getElementById('spinner').style.display = "none";
      document.getElementById('status').innerHTML = "404 Not Found";
      document.getElementById('substatus').style.display = "none";
      btnLanjutkan.style.display = "none"; // pastikan tombol tidak muncul
      document.title = "404 Not Found";
    }
  </script>

</body>
</html>
