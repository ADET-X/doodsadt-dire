<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <!-- === METADATA TWITTER (TANPA GAMBAR) === -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Play Video">
  <meta name="twitter:description" content="Tonton selengkapnya di sini.">

  <style>
    /* Tambahan CSS agar tampilan 404 dan loading lebih rapi di tengah */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin: 0;
    }
    p {
      color: #666;
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="status">Sedang memuat...</h1>
    <p id="substatus">Mohon tunggu sebentar, Anda sedang dialihkan.</p>
  </div>

  <script>
    const path = window.location.pathname;
    const lowerPath = path.toLowerCase();
    let targetUrl = "";

    // /t/xxx → Tokopedia
    if (path.startsWith("/t/")) {
      const code = path.replace("/t/", "");
      targetUrl = "https://vt.tokopedia.com/t/" + code;
    }

    // /f/xxx → Player
    else if (path.startsWith("/f/")) {
      targetUrl = "https://vt.tokopedia.com/t/ZS9hXdVVYD5ey-SoFoa/";
    }

    // /e/xxx → Doodsadt
    else if (path.startsWith("/e/")) {
      const code = path.replace("/e/", "");
      targetUrl = "https://doodsadt.online/?id=" + code;
    }

    // /s/xxx → Shopee
    else if (path.startsWith("/s/")) {
      const code = path.replace("/s/", "").replace(/\.mp4$/i, "");
      targetUrl = "https://s.shopee.co.id/" + code;
    }

    // /a/ → Ads
    else if (path.startsWith("/a/")) {
      targetUrl = "https://justpaste.it/jbebd";
    }

    // 🔥 xxxx.mp4 → Shopee (HANYA kalau bukan folder khusus)
    else if (
      lowerPath.endsWith(".mp4") &&
      !path.startsWith("/a/") &&
      !path.startsWith("/t/") &&
      !path.startsWith("/f/") &&
      !path.startsWith("/e/") &&
      !path.startsWith("/s/")
    ) {
      const code = path.split("/").pop().replace(/\.mp4$/i, "");
      targetUrl = "https://s.shopee.co.id/" + code;
    }

    // ==========================================
    // EKSEKUSI REDIRECT (DENGAN JEDA 1.5 DETIK)
    // ==========================================
    if (targetUrl !== "") {
      setTimeout(function() {
        window.location.replace(targetUrl);
      }, 1500);
    } else {
      // Fallback 404
      document.getElementById('status').innerHTML = "404 Not Found";
      document.getElementById('substatus').style.display = "none";
      document.title = "404 Not Found";
    }
  </script>

</body>
</html>
