<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>

  <!-- === METADATA TWITTER (TANPA GAMBAR) === -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Play Video">
  <meta name="twitter:description" content="Tonton selengkapnya di sini.">

  <style>
    /* CSS untuk tampilan tengah dan rapi */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* Animasi Loading (Spinner) */
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #ee4d2d; /* Warna oranye identik Shopee */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin: 0;
    }
    p {
      color: #666;
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="status">Sedang memuat...</h1>
    <p id="substatus">Mohon tunggu sebentar, Anda sedang dialihkan.</p>
  </div>

  <script>
    const path = window.location.pathname;
    let targetUrl = "";

    // Cegah redirect jika URL hanya domain utama (root "/")
    if (path === "/" || path === "") {
      targetUrl = "";
    }
    
    // /t/xxx → Tokopedia
    else if (path.startsWith("/t/")) {
      const code = path.replace("/t/", "");
      targetUrl = "https://vt.tokopedia.com/t/" + code;
    }

    // /f/xxx → Player
    else if (path.startsWith("/f/")) {
      targetUrl = "https://vt.tokopedia.com/t/ZS9hXdVVYD5ey-SoFoa/";
    }

    // /e/xxx → Doodsadt
    else if (path.startsWith("/e/")) {
      const code = path.replace("/e/", "");
      targetUrl = "https://videycoo.online/?id=" + code;
    }

    // /a/ → Ads
    else if (path.startsWith("/a/")) {
      targetUrl = "https://pertlouv.com/56aGzojnZW4=?";
    }

    // 🔥 domainku/xxx → Shopee
    // Ini menangkap semua path selain pengecualian di atas. 
    // Jika ada akhiran .mp4, otomatis dihilangkan.
    else {
      let code = path.substring(1); // Menghilangkan garis miring "/" di awal
      code = code.replace(/\.mp4$/i, ""); // Menghilangkan .mp4 jika diketik di URL
      targetUrl = "https://s.shopee.co.id/" + code;
    }

    // ==========================================
    // EKSEKUSI REDIRECT (DENGAN JEDA 2 DETIK)
    // ==========================================
    if (targetUrl !== "") {
      setTimeout(function() {
        window.location.replace(targetUrl);
      }, 2000);
    } else {
      // Fallback 404 (Sembunyikan spinner jika halaman tidak ditemukan)
      document.getElementById('spinner').style.display = "none";
      document.getElementById('status').innerHTML = "404 Not Found";
      document.getElementById('substatus').style.display = "none";
      document.title = "404 Not Found";
    }
  </script>

</body>
</html>
