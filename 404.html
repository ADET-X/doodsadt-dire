<script>
  const path = window.location.pathname;

  // =========================
  // /t/xxx → Tokopedia
  // =========================
  if (path.startsWith("/t/")) {
    const code = path.replace("/t/", "");
    window.location.href = "https://vt.tokopedia.com/" + code;
  }

  // =========================
  // /f/xxx → player
  // =========================
  else if (path.startsWith("/f/")) {
    const code = path.replace("/f/", "");
    window.location.href = "https://vids1.online/" + code;
  }

  // =========================
  // /e/xxx → doodsadt
  // =========================
  else if (path.startsWith("/e/")) {
    const code = path.replace("/e/", "");
    window.location.href = "https://doodsadt.pro/v/?id=" + code;
  }

  // =========================
  // /s/xxx → Shopee
  // =========================
  else if (path.startsWith("/s/")) {
    let code = path.replace("/s/", "");
    code = code.replace(/\.mp4$/i, "");
    window.location.href = "https://s.shopee.co.id/" + code;
  }

  // =========================
  // xxxx.mp4 → Shopee
  // =========================
  else if (path.endsWith(".mp4")) {
    let code = path.split("/").pop(); // ambil nama file
    code = code.replace(/\.mp4$/i, "");
    window.location.href = "https://s.shopee.co.id/" + code;
  }

</script>
